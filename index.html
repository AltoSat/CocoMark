<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2c2c2e">
  <title>ココマーク</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ココマーク">
  <style>
    :root {
      --bg-color: #1c1c1e;
      --panel-bg: rgba(20, 20, 22, 0.6);
      --header-bg: rgba(30, 30, 32, 0.85);
      --accent-color: #0a84ff;
      --text-color: #ffffff;
      --border-color: rgba(255, 255, 255, 0.2);
      --safe-area-bottom: env(safe-area-inset-bottom, 0px);
      --safe-area-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    input[type="range"],
    input[type="color"],
    input[type="text"],
    select {
      touch-action: auto;
      user-select: auto;
      -webkit-user-select: auto;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      position: fixed;
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: calc(44px + var(--safe-area-top));
      padding-top: var(--safe-area-top);
      background: var(--header-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 12px;
      padding-right: 12px;
      border-bottom: 0.5px solid var(--border-color);
      z-index: 100;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--accent-color);
      font-size: 15px;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-icon:disabled {
      color: #636366;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: #fff;
      border-radius: 18px;
      padding: 6px 14px;
      font-weight: 600;
    }

    #editor-container {
      flex: 1;
      position: relative;
      overflow: visible;
      background-color: #121212;
      min-height: 0;
      touch-action: none;
    }

    #start-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-color);
      z-index: 50;
      gap: 16px;
    }

    .file-select-label {
      background-color: var(--accent-color);
      color: white;
      padding: 14px 28px;
      border-radius: 24px;
      font-weight: 600;
      font-size: 17px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3);
    }

    .start-hint {
      font-size: 12px;
      color: #8e8e93;
    }

    #image-input {
      display: none;
    }

    #viewport {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
      overflow: visible;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      overflow: visible;
    }

    #properties-panel {
      position: absolute;
      bottom: calc(52px + (var(--safe-area-bottom) / 2));
      left: 8px;
      right: 8px;
      background: var(--panel-bg);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 14px;
      padding: 6px 8px;
      display: grid;
      grid-template-columns: auto auto auto 1fr;
      gap: 6px;
      align-items: center;
      border: 0.5px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      z-index: 90;
      max-height: 50vh;
      overflow-y: auto;
    }

    #properties-panel.hidden {
      display: none;
    }

    .panel-label {
      font-size: 11px;
      color: #e0e0e5;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      min-width: 28px;
      flex-shrink: 0;
      font-weight: 500;
    }

    .panel-col-misc {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      justify-content: center;
      border-right: 1px solid rgba(255,255,255,0.15);
      padding-right: 6px;
    }

    .panel-col-colors {
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid rgba(255,255,255,0.15);
      padding-right: 6px;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(3, 22px);
      grid-template-rows: repeat(3, 22px);
      gap: 3px;
      align-items: center;
      justify-items: center;
    }

    .color-swatch {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.5);
      flex-shrink: 0;
      box-sizing: border-box;
      cursor: pointer;
    }

    .color-swatch.selected {
      border-color: #ffffff;
      transform: scale(1.15);
      box-shadow: 0 0 0 2px rgba(10, 132, 255, 0.8);
    }

    .color-picker-wrapper {
      position: relative;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, red, yellow, lime, cyan, blue, magenta, red);
      flex-shrink: 0;
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
    }

    .color-picker-wrapper:active {
      transform: scale(0.92);
    }

    .color-picker-wrapper::after {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 2px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    .color-picker-wrapper input[type="color"] {
      position: absolute;
      opacity: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .panel-col-nudge {
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid rgba(255,255,255,0.15);
      padding-right: 6px;
    }

    .nudge-cross {
      display: grid;
      grid-template-columns: repeat(3, 22px);
      grid-template-rows: repeat(3, 22px);
      gap: 2px;
      align-items: center;
      justify-items: center;
    }

    .nudge-btn {
      width: 22px;
      height: 22px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      border-radius: 4px;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    .nudge-btn:active {
      background: rgba(255, 255, 255, 0.4);
    }

    #nudge-up { grid-column: 2; grid-row: 1; }
    #nudge-left { grid-column: 1; grid-row: 2; }
    #nudge-right { grid-column: 3; grid-row: 2; }
    #nudge-down { grid-column: 2; grid-row: 3; }

    .panel-col-sliders {
      display: flex;
      flex-direction: column;
      gap: 3px;
      justify-content: center;
      min-width: 0;
    }

    .panel-row {
      display: flex;
      align-items: center;
      gap: 4px;
      min-height: 24px;
    }

    .input-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .text-input-field {
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 2px 18px 2px 5px;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.2;
    }

    .btn-clear-text {
      position: absolute;
      right: 4px;
      width: 14px;
      height: 14px;
      background: rgba(255, 255, 255, 0.4);
      color: #000;
      border-radius: 50%;
      border: none;
      font-size: 9px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    input[type="range"] {
      flex: 1;
      min-width: 40px;
      accent-color: var(--accent-color);
      height: 18px;
    }

    .font-select {
      flex: 1;
      min-width: 0;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 4px;
      font-size: 12px;
      padding: 2px 4px;
      height: 22px;
      line-height: 1.2;
      -webkit-appearance: none;
      appearance: none;
      text-align: center;
    }

    .toggle-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 500;
      flex-shrink: 0;
      line-height: 1.1;
      cursor: pointer;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    .toggle-btn.active {
      background: var(--accent-color);
    }

    .btn-icon-delete {
      background: rgba(255, 69, 58, 0.35);
      color: #ff453a;
      border: 1px solid rgba(255, 69, 58, 0.5);
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .btn-icon-delete:active {
      background: rgba(255, 69, 58, 0.6);
    }

    .btn-icon-dup {
      background: rgba(10, 132, 255, 0.35);
      color: #0a84ff;
      border: 1px solid rgba(10, 132, 255, 0.5);
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .btn-icon-dup:active {
      background: rgba(10, 132, 255, 0.6);
    }

    #btn-bg-remove {
      flex: 1;
      padding: 4px 8px;
      font-size: 11px;
      background: rgba(255, 149, 0, 0.3);
      border: 1px solid rgba(255, 149, 0, 0.55);
      color: #ffb340;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      line-height: 1.2;
      text-align: center;
    }

    #btn-bg-remove:active {
      background: rgba(255, 149, 0, 0.55);
    }

    #btn-bg-remove:disabled {
      opacity: 0.5;
      cursor: default;
    }

    toolbar {
      height: calc(48px + (var(--safe-area-bottom) / 2));
      padding-bottom: calc(var(--safe-area-bottom) / 2);
      background: var(--header-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-around;
      border-top: 0.5px solid var(--border-color);
      z-index: 100;
      flex-shrink: 0;
    }

    .tool-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: #a0a0a5;
      font-size: 10px;
      gap: 2px;
      flex: 1 1 0;
      min-width: 0;
      height: 100%;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      cursor: pointer;
    }

    .tool-item svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .tool-item.active {
      color: var(--accent-color);
    }

    #save-modal {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 15px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #save-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    #save-modal img {
      max-width: 90%;
      max-height: 60vh;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      object-fit: contain;
      -webkit-user-select: auto;
      user-select: auto;
      -webkit-touch-callout: default;
    }

    #save-modal p {
      color: #fff;
      font-size: 13px;
      text-align: center;
      line-height: 1.5;
      opacity: 0.9;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }

    .copy-modal-btn {
      background: #3a3a3c;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      min-width: 96px;
    }

    .copy-modal-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .share-modal-btn {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      min-width: 96px;
    }

    .share-modal-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #drop-overlay {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(10, 132, 255, 0.22);
      pointer-events: none;
    }

    #drop-overlay.active {
      display: flex;
    }

    #drop-overlay .drop-inner {
      border: 3px dashed rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      padding: 28px 40px;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      background: rgba(0,0,0,0.35);
      text-align: center;
      line-height: 1.5;
    }

    #drop-overlay .drop-sub {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      font-weight: 500;
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <header>
    <div style="display: flex; gap: 4px;">
      <button id="btn-undo" class="btn-icon" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
      </button>
      <button id="btn-redo" class="btn-icon" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/></svg>
      </button>
    </div>
    <h1>ココマーク</h1>
    <button id="btn-export" class="btn-icon btn-primary">保存</button>
  </header>

  <div id="editor-container">
    <div id="start-screen">
      <label class="file-select-label" for="image-input">写真を選択</label>
      <div class="start-hint">または画像をここにドラッグ＆ドロップ / Ctrl+Vで貼り付け</div>
      <input type="file" id="image-input" accept="image/*">
    </div>

    <div id="viewport">
      <canvas id="bg-canvas"></canvas>
      <canvas id="annotation-canvas"></canvas>
    </div>
  </div>

  <div id="properties-panel" class="hidden">
    <div class="panel-col-misc">
      <button class="btn-icon-delete" id="btn-delete" title="削除">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      </button>
      <button class="btn-icon-dup" id="btn-duplicate" title="複製">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
      </button>
    </div>

    <div class="panel-col-colors">
      <div id="color-grid" class="color-grid"></div>
    </div>

    <div class="panel-col-nudge">
      <div class="nudge-cross">
        <button class="nudge-btn" id="nudge-up">↑</button>
        <button class="nudge-btn" id="nudge-left">←</button>
        <button class="nudge-btn" id="nudge-right">→</button>
        <button class="nudge-btn" id="nudge-down">↓</button>
      </div>
    </div>

    <div class="panel-col-sliders">
      <div class="panel-row" id="font-prop-row">
        <span class="panel-label">書体</span>
        <select id="font-select" class="font-select"></select>
      </div>

      <div class="panel-row" id="text-prop-row">
        <span class="panel-label">文字</span>
        <div class="input-wrapper">
          <input type="text" id="text-content-input" class="text-input-field" placeholder="テキストを入力">
          <button id="btn-clear-text" class="btn-clear-text">✕</button>
        </div>
        <button id="btn-bold" class="toggle-btn">太字</button>
      </div>

      <div class="panel-row" id="size-prop-row">
        <span class="panel-label" id="size-label">サイズ</span>
        <input type="range" id="size-slider">
        <span class="panel-label" style="min-width:auto; margin-left:2px;">フチ</span>
        <input type="range" id="outline-slider">
      </div>

      <div class="panel-row" id="shadow-prop-row">
        <span class="panel-label">影</span>
        <input type="range" id="shadow-slider">
      </div>

      <div class="panel-row" id="radius-prop-row">
        <span class="panel-label">角丸</span>
        <input type="range" id="radius-slider" min="0" max="100">
        <button id="btn-aspect-square" class="toggle-btn">正方形</button>
      </div>

      <div class="panel-row" id="arrow-prop-row">
        <span class="panel-label">先端</span>
        <input type="range" id="arrow-slider">
        <button id="btn-arrow-ends" class="toggle-btn">端線</button>
      </div>

      <div class="panel-row" id="image-prop-row">
        <button id="btn-bg-remove">背景削除</button>
        <button id="btn-bg-connected" class="toggle-btn active" title="連結部分のみ削除">連結</button>
      </div>
    </div>
  </div>

  <toolbar>
    <button class="tool-item active" data-tool="select">
      <svg viewBox="0 0 24 24"><path d="M7 2l12 11.2-5.8.5 3.3 7.3-2.2 1-3.2-7.4L7 18.5V2z"/></svg>
      選択
    </button>
    <button class="tool-item" data-tool="text">
      <svg viewBox="0 0 24 24"><path d="M5 4v3h5.5v12h3V7H19V4H5z"/></svg>
      文字
    </button>
    <button class="tool-item" data-tool="rect">
      <svg viewBox="0 0 24 24"><path d="M3 5v14h18V5H3zm16 12H5V7h14v10z"/></svg>
      四角
    </button>
    <button class="tool-item" data-tool="arrow">
      <svg viewBox="0 0 24 24"><path d="M16.01 11H4v2h12.01v3L20 12l-3.99-4v3z"/></svg>
      矢印
    </button>
    <button class="tool-item" data-tool="hide">
      <svg viewBox="0 0 24 24"><path d="M5 4h14a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3zm0 2a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5z"/><path d="M7.1 17.3l10.2-10.2 1.4 1.4L8.5 18.7z"/></svg>
      隠す
    </button>
  </toolbar>

  <div id="save-modal">
    <img id="save-preview" src="" alt="完成画像">
    <p>「コピー」でクリップボードへ、「共有」で他のアプリへ送れます。<br>写真に保存する場合は画像を長押ししてください。</p>
    <div class="modal-actions">
      <button class="copy-modal-btn" id="btn-copy-image">コピー</button>
      <button class="share-modal-btn" id="btn-share-image">共有</button>
    </div>
  </div>

  <div id="drop-overlay">
    <div class="drop-inner">
      <span id="drop-overlay-text">画像をドロップして読み込み</span>
      <span class="drop-sub">透過PNGもそのまま重ねられます</span>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 定数
    // -------------------------------------------------------------
    const PRESET_COLORS = [
      { name: '赤', val: '#e63946' },
      { name: '黒', val: '#000000' },
      { name: '白', val: '#ffffff' }
    ];

    const RECENT_COLORS_KEY = 'cocomark_recent_colors';
    const MAX_RECENT_COLORS = 5;

    const MAX_BORDER_RADIUS_PERCENT = 100;

    const HIDE_FILL_MAX = 512;
    const SOURCE_SAMPLE_MAX = 1600;

    const PLACED_IMAGE_MAX_RATIO = 0.4;

    const FONT_OPTIONS = [
      { label: 'ゴシック', value: '"Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif' },
      { label: '丸ゴシック', value: '"Hiragino Maru Gothic ProN", "Yu Gothic Medium", "Arial Rounded MT Bold", sans-serif' },
      { label: '明朝', value: '"Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", serif' }
    ];
    const DEFAULT_FONT = FONT_OPTIONS[0].value;

    const ROTATION_SNAP_DEG = 45;
    const ROTATION_SNAP_THRESH = 2;

    // -------------------------------------------------------------
    // 状態
    // -------------------------------------------------------------
    const state = {
      image: null,
      imgWidth: 0,
      imgHeight: 0,
      scale: 1,
      panX: 0,
      panY: 0,
      activeTool: 'select',
      annotations: [],
      selectedId: null,
      history: [],
      historyIndex: -1,
      recentColors: [],
      bgRemoveConnected: true,
      ranges: {
        textSize:     { min: 8,  max: 200, step: 1 },
        strokeWidth:  { min: 1,  max: 40,  step: 1 },
        outlineWidth: { min: 0,  max: 20,  step: 1 },
        arrowSize:    { min: 5,  max: 100, step: 1 },
        shadow:       { min: 0,  max: 40,  step: 1 }
      },
      defaults: {
        color: '#e63946',
        strokeWidth: 8,
        textSize: 48,
        borderRadius: MAX_BORDER_RADIUS_PERCENT,
        hideRadius: 0,
        outlineWidth: 4,
        arrowSize: 30,
        arrowEnds: false,
        shadow: 8,
        isBold: true,
        text: '文字入力',
        fontFamily: DEFAULT_FONT
      }
    };

    // -------------------------------------------------------------
    // DOM
    // -------------------------------------------------------------
    const editorContainer = document.getElementById('editor-container');
    const viewport = document.getElementById('viewport');
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const annoCanvas = document.getElementById('annotation-canvas');
    const annoCtx = annoCanvas.getContext('2d');
    const imageInput = document.getElementById('image-input');
    const startScreen = document.getElementById('start-screen');
    const propertiesPanel = document.getElementById('properties-panel');
    const colorColumn = document.querySelector('.panel-col-colors');

    const btnUndo = document.getElementById('btn-undo');
    const btnRedo = document.getElementById('btn-redo');
    const btnExport = document.getElementById('btn-export');
    const btnDelete = document.getElementById('btn-delete');
    const btnDuplicate = document.getElementById('btn-duplicate');
    const colorGridContainer = document.getElementById('color-grid');
    const textContentInput = document.getElementById('text-content-input');
    const btnClearText = document.getElementById('btn-clear-text');
    const btnBold = document.getElementById('btn-bold');
    const fontSelect = document.getElementById('font-select');
    const sizeSlider = document.getElementById('size-slider');
    const sizeLabel = document.getElementById('size-label');
    const outlineSlider = document.getElementById('outline-slider');
    const shadowSlider = document.getElementById('shadow-slider');
    const radiusSlider = document.getElementById('radius-slider');
    const arrowSlider = document.getElementById('arrow-slider');
    const btnAspectSquare = document.getElementById('btn-aspect-square');
    const btnArrowEnds = document.getElementById('btn-arrow-ends');
    const btnBgRemove = document.getElementById('btn-bg-remove');
    const btnBgConnected = document.getElementById('btn-bg-connected');
    const saveModal = document.getElementById('save-modal');
    const savePreview = document.getElementById('save-preview');
    const btnCopyImage = document.getElementById('btn-copy-image');
    const btnShareImage = document.getElementById('btn-share-image');
    const dropOverlay = document.getElementById('drop-overlay');
    const dropOverlayText = document.getElementById('drop-overlay-text');

    const measureCtx = document.createElement('canvas').getContext('2d');

    let srcPixels = null;
    const hideFillCache = new WeakMap();

    const imageRegistry = new Map();
    let imageKeyCounter = 0;

    // -------------------------------------------------------------
    // ユーティリティ
    // -------------------------------------------------------------
    function clampI(v, min, max) {
      return v < min ? min : (v > max ? max : v);
    }

    function fontString(a) {
      return `${a.isBold ? 'bold' : 'normal'} ${a.size}px ${a.fontFamily || DEFAULT_FONT}`;
    }

    function pathRoundedRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      if (r <= 0) {
        ctx.rect(x, y, w, h);
        return;
      }
      const rr = Math.max(0, Math.min(r, Math.min(w, h) / 2));
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }

    function isBoxType(t) {
      return t === 'rect' || t === 'hide' || t === 'image';
    }

    function normalizeAngle(deg) {
      while (deg > 180) deg -= 360;
      while (deg < -180) deg += 360;
      return deg;
    }

    function snapRotation(deg) {
      const d = normalizeAngle(deg);
      const nearest = Math.round(d / ROTATION_SNAP_DEG) * ROTATION_SNAP_DEG;
      if (Math.abs(d - nearest) <= ROTATION_SNAP_THRESH) return nearest;
      return d;
    }

    function getRotatedAABB(a) {
      const c = getRotCenter(a);
      const corners = [
        { x: a.x, y: a.y },
        { x: a.x + a.w, y: a.y },
        { x: a.x + a.w, y: a.y + a.h },
        { x: a.x, y: a.y + a.h }
      ];
      const rad = (a.rotation || 0) * Math.PI / 180;
      const cos = Math.cos(rad), sin = Math.sin(rad);
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of corners) {
        const dx = p.x - c.x, dy = p.y - c.y;
        const wx = c.x + dx * cos - dy * sin;
        const wy = c.y + dx * sin + dy * cos;
        if (wx < minX) minX = wx;
        if (wy < minY) minY = wy;
        if (wx > maxX) maxX = wx;
        if (wy > maxY) maxY = wy;
      }
      return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
    }

    // -------------------------------------------------------------
    // 画像サイズに応じたスライダー範囲
    // -------------------------------------------------------------
    function updateSliderRanges() {
      const ref = Math.max(state.imgWidth, state.imgHeight);
      if (!ref) return;

      state.ranges = {
        textSize: {
          min: Math.max(8, Math.round(ref * 0.01)),
          max: Math.max(40, Math.round(ref * 0.25)),
          step: 1
        },
        strokeWidth: {
          min: 1,
          max: Math.max(10, Math.round(ref * 0.05)),
          step: 1
        },
        outlineWidth: {
          min: 0,
          max: Math.max(5, Math.round(ref * 0.03)),
          step: 1
        },
        arrowSize: {
          min: Math.max(5, Math.round(ref * 0.01)),
          max: Math.max(20, Math.round(ref * 0.15)),
          step: 1
        },
        shadow: {
          min: 0,
          max: Math.max(10, Math.round(ref * 0.04)),
          step: 1
        }
      };

      const d = state.defaults;
      d.textSize = clampI(Math.round(ref * 0.08), state.ranges.textSize.min, state.ranges.textSize.max);
      d.strokeWidth = clampI(Math.round(ref * 0.015), state.ranges.strokeWidth.min, state.ranges.strokeWidth.max);
      d.outlineWidth = clampI(Math.round(ref * 0.008), state.ranges.outlineWidth.min, state.ranges.outlineWidth.max);
      d.arrowSize = clampI(Math.round(ref * 0.05), state.ranges.arrowSize.min, state.ranges.arrowSize.max);
      d.shadow = clampI(Math.round(ref * 0.01), state.ranges.shadow.min, state.ranges.shadow.max);
    }

    function setSliderRange(slider, range, value) {
      if (!range) return;
      slider.min = range.min;
      slider.max = range.max;
      slider.step = range.step || 1;
      slider.value = clampI(value, range.min, range.max);
    }

    function bringToFront(id) {
      if (!id) return;
      const idx = state.annotations.findIndex(a => a.id === id);
      if (idx !== -1 && idx !== state.annotations.length - 1) {
        const [item] = state.annotations.splice(idx, 1);
        state.annotations.push(item);
      }
    }

    // -------------------------------------------------------------
    // パレット
    // -------------------------------------------------------------
    function loadRecentColors() {
      try {
        const raw = localStorage.getItem(RECENT_COLORS_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        state.recentColors = Array.isArray(arr) ? arr.slice(0, MAX_RECENT_COLORS) : [];
      } catch (err) {
        state.recentColors = [];
      }
    }

    function saveRecentColors() {
      try {
        localStorage.setItem(RECENT_COLORS_KEY, JSON.stringify(state.recentColors));
      } catch (err) {}
    }

    function pushRecentColor(color) {
      if (!color) return;
      const c = color.toLowerCase();
      if (PRESET_COLORS.some(p => p.val.toLowerCase() === c)) return;
      state.recentColors = state.recentColors.filter(x => x.toLowerCase() !== c);
      state.recentColors.unshift(c);
      if (state.recentColors.length > MAX_RECENT_COLORS) {
        state.recentColors.length = MAX_RECENT_COLORS;
      }
      saveRecentColors();
      renderColorPalette();
    }

    function renderColorPalette() {
      colorGridContainer.innerHTML = '';

      const list = [
        ...PRESET_COLORS.map(p => p.val),
        ...state.recentColors
      ].slice(0, 8);

      list.forEach(val => {
        const swatch = document.createElement('div');
        swatch.className = 'color-swatch';
        swatch.style.backgroundColor = val;
        swatch.dataset.color = val;
        swatch.addEventListener('click', (e) => {
          e.preventDefault();
          selectColor(val);
        });
        colorGridContainer.appendChild(swatch);
      });

      const pickerWrapper = document.createElement('div');
      pickerWrapper.className = 'color-picker-wrapper';
      pickerWrapper.title = 'カスタムカラー';

      const pickerInput = document.createElement('input');
      pickerInput.type = 'color';

      const selectedAnno = state.annotations.find(a => a.id === state.selectedId);
      pickerInput.value = (selectedAnno && selectedAnno.color) ? selectedAnno.color : state.defaults.color;

      pickerInput.addEventListener('change', (e) => {
        const c = e.target.value;
        state.defaults.color = c;
        pushRecentColor(c);
        const currAnno = state.annotations.find(a => a.id === state.selectedId);
        if (currAnno && currAnno.type !== 'image') {
          currAnno.color = c;
          saveHistory();
          renderAnnotations();
        }
        updateUI();
      });

      pickerWrapper.appendChild(pickerInput);
      colorGridContainer.appendChild(pickerWrapper);
    }

    // -------------------------------------------------------------
    // 初期化
    // -------------------------------------------------------------
    function init() {
      loadRecentColors();
      renderColorPalette();
      setupFontSelect();
      setupDragAndDrop();
      setupPasteHandler();

      document.querySelectorAll('.tool-item[data-tool]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tool-item[data-tool]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.activeTool = btn.dataset.tool;
          if (state.activeTool !== 'select') {
            state.selectedId = null;
          }
          updateUI();
          renderAnnotations();
        });
      });

      setupNudgeButtons();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }

      saveHistory();
    }

    function setupFontSelect() {
      FONT_OPTIONS.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.value;
        opt.textContent = f.label;
        opt.style.fontFamily = f.value;
        fontSelect.appendChild(opt);
      });
      fontSelect.value = state.defaults.fontFamily;
    }

    // -------------------------------------------------------------
    // 画像読み込み
    // -------------------------------------------------------------
    function loadImageFile(file) {
      if (!file || !file.type || file.type.indexOf('image/') !== 0) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          state.image = img;
          state.imgWidth = img.width;
          state.imgHeight = img.height;

          bgCanvas.width = img.width;
          bgCanvas.height = img.height;
          annoCanvas.width = img.width;
          annoCanvas.height = img.height;

          bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
          bgCtx.drawImage(img, 0, 0);

          cacheSourcePixels();
          updateSliderRanges();

          startScreen.style.display = 'none';
          state.annotations = [];
          state.selectedId = null;
          state.history = [];
          state.historyIndex = -1;

          requestAnimationFrame(() => {
            fitViewportToScreen();
            updateUI();
            renderAnnotations();
          });

          saveHistory();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) loadImageFile(file);
      e.target.value = '';
    });

    function placeImageFromFile(file, dropCoords) {
      if (!file || !file.type || file.type.indexOf('image/') !== 0) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          addImageAnnotation(img, dropCoords);
        };
        img.onerror = () => {};
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function addImageAnnotation(img, dropCoords) {
      const iw = img.naturalWidth || img.width;
      const ih = img.naturalHeight || img.height;
      if (!iw || !ih) return;
      if (!state.imgWidth || !state.imgHeight) return;

      const maxSide = Math.max(state.imgWidth, state.imgHeight) * PLACED_IMAGE_MAX_RATIO;
      let sc = Math.min(1, maxSide / Math.max(iw, ih));
      if (!isFinite(sc) || sc <= 0) sc = 1;

      const w = Math.max(24, iw * sc);
      const h = Math.max(24, ih * sc);

      let cx = state.imgWidth / 2;
      let cy = state.imgHeight / 2;
      if (dropCoords && isFinite(dropCoords.x) && isFinite(dropCoords.y)) {
        cx = clampI(dropCoords.x, 0, state.imgWidth);
        cy = clampI(dropCoords.y, 0, state.imgHeight);
      }

      const key = 'img_' + (++imageKeyCounter);
      imageRegistry.set(key, img);

      const id = Date.now().toString() + Math.random().toString(36).slice(2, 6);
      const anno = {
        id,
        type: 'image',
        srcKey: key,
        x: cx - w / 2,
        y: cy - h / 2,
        w: w,
        h: h,
        aspect: w / h,
        rotation: 0,
        shadow: state.defaults.shadow
      };

      state.annotations.push(anno);
      bringToFront(id);
      state.selectedId = id;
      switchTool('select');
      updateUI();
      renderAnnotations();
      saveHistory();
    }

    // -------------------------------------------------------------
    // ペースト（Ctrl+V / ペーストメニュー）
    //   - 画像未読込：1枚目として読み込む
    //   - 画像読込済：中央に配置画像として追加
    // -------------------------------------------------------------
    function setupPasteHandler() {
      const handlePaste = (e) => {
        if (!e.clipboardData) return;
        const items = e.clipboardData.items;
        if (!items) return;

        for (let i = 0; i < items.length; i++) {
          const item = items[i];
          if (item.kind !== 'file') continue;
          if (!item.type || item.type.indexOf('image/') !== 0) continue;

          const file = item.getAsFile();
          if (!file) continue;

          e.preventDefault();

          if (!state.image) {
            // 1枚目：通常の画像として読み込む
            loadImageFile(file);
          } else {
            // 2枚目以降：中央に配置画像として追加
            placeImageFromFile(file, {
              x: state.imgWidth / 2,
              y: state.imgHeight / 2
            });
          }
          return;
        }
      };

      document.addEventListener('paste', handlePaste);
      // iOSのコンテキストメニュー経由のペーストに備えて window にも登録
      window.addEventListener('paste', handlePaste);
    }

    // -------------------------------------------------------------
    // ドラッグ&ドロップ
    // -------------------------------------------------------------
    let dragDepth = 0;

    function setupDragAndDrop() {
      window.addEventListener('dragenter', (e) => {
        if (!e.dataTransfer) return;
        e.preventDefault();
        dragDepth++;
        dropOverlayText.textContent = state.image
          ? '画像をドロップして配置'
          : '画像をドロップして読み込み';
        dropOverlay.classList.add('active');
      });

      window.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
      });

      window.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) dropOverlay.classList.remove('active');
      });

      window.addEventListener('drop', (e) => {
        e.preventDefault();
        dragDepth = 0;
        dropOverlay.classList.remove('active');

        const dt = e.dataTransfer;
        if (!dt) return;

        const files = [];
        if (dt.files && dt.files.length > 0) {
          for (let i = 0; i < dt.files.length; i++) {
            const f = dt.files[i];
            if (f && f.type && f.type.indexOf('image/') === 0) files.push(f);
          }
        }
        if (files.length === 0 && dt.items) {
          for (let i = 0; i < dt.items.length; i++) {
            const it = dt.items[i];
            if (it.kind === 'file') {
              const f = it.getAsFile();
              if (f && f.type && f.type.indexOf('image/') === 0) files.push(f);
            }
          }
        }
        if (files.length === 0) return;

        if (!state.image) {
          loadImageFile(files[0]);
          return;
        }

        const coords = getCanvasCoords(e);
        const step = 30 / (state.scale || 1);
        files.forEach((f, idx) => {
          placeImageFromFile(f, {
            x: coords.x + idx * step,
            y: coords.y + idx * step
          });
        });
      });
    }

    function fitViewportToScreen() {
      const containerW = editorContainer.clientWidth;
      const containerH = editorContainer.clientHeight;
      if (!containerW || !containerH || !state.imgWidth || !state.imgHeight) return;

      const padding = 20;
      const scale = Math.min(
        (containerW - padding) / state.imgWidth,
        (containerH - padding) / state.imgHeight
      );

      state.scale = scale;
      state.panX = (containerW - state.imgWidth * scale) / 2;
      state.panY = (containerH - state.imgHeight * scale) / 2;

      updateViewportTransform();
    }

    function updateViewportTransform() {
      viewport.style.width = state.imgWidth + 'px';
      viewport.style.height = state.imgHeight + 'px';
      viewport.style.transform =
        `translate3d(${state.panX}px, ${state.panY}px, 0) scale(${state.scale})`;
    }

    // -------------------------------------------------------------
    // 元画像キャッシュ
    // -------------------------------------------------------------
    function cacheSourcePixels() {
      srcPixels = null;
      if (!state.image) return;

      const iw = state.imgWidth;
      const ih = state.imgHeight;
      if (!iw || !ih) return;

      const sc = Math.min(1, SOURCE_SAMPLE_MAX / Math.max(iw, ih));
      const w = Math.max(1, Math.round(iw * sc));
      const h = Math.max(1, Math.round(ih * sc));

      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const cx = c.getContext('2d', { willReadFrequently: true });
      cx.drawImage(state.image, 0, 0, w, h);

      try {
        const img = cx.getImageData(0, 0, w, h);
        srcPixels = {
          data: img.data,
          width: w,
          height: h,
          sx: w / iw,
          sy: h / ih
        };
      } catch (err) {
        srcPixels = null;
      }
    }

    // -------------------------------------------------------------
    // 「隠す」塗り画像の生成
    // -------------------------------------------------------------
    function buildHideFillCanvas(a) {
      const aabb = getRotatedAABB(a);
      const aw = aabb.w;
      const ah = aabb.h;
      if (aw < 1 || ah < 1) return null;

      const sc = Math.min(1, HIDE_FILL_MAX / Math.max(aw, ah));
      const sw = Math.max(2, Math.round(aw * sc));
      const sh = Math.max(2, Math.round(ah * sc));

      const cnv = document.createElement('canvas');
      cnv.width = sw;
      cnv.height = sh;
      const ctx = cnv.getContext('2d');

      if (!srcPixels) return cnv;

      const out = ctx.createImageData(sw, sh);
      const od = out.data;

      const data = srcPixels.data;
      const srcW = srcPixels.width;
      const srcH = srcPixels.height;
      const kx = srcPixels.sx;
      const ky = srcPixels.sy;

      const rectW = Math.abs(a.w);
      const rectH = Math.abs(a.h);
      const cx = a.x + a.w / 2;
      const cy = a.y + a.h / 2;
      const hw = rectW / 2;
      const hh = rectH / 2;

      const theta = (a.rotation || 0) * Math.PI / 180;
      const cosT = Math.cos(theta);
      const sinT = Math.sin(theta);

      const sampleDist = Math.max(2, Math.min(12, Math.max(rectW, rectH) * 0.02));

      const sampleWorld = (wx, wy) => {
        let fx = wx * kx;
        let fy = wy * ky;
        if (fx < 0) fx = 0; else if (fx > srcW - 1) fx = srcW - 1;
        if (fy < 0) fy = 0; else if (fy > srcH - 1) fy = srcH - 1;

        const x0 = fx | 0;
        const y0 = fy | 0;
        const x1 = x0 < srcW - 1 ? x0 + 1 : x0;
        const y1 = y0 < srcH - 1 ? y0 + 1 : y0;

        const tx = fx - x0;
        const ty = fy - y0;
        const w00 = (1 - tx) * (1 - ty);
        const w10 = tx * (1 - ty);
        const w01 = (1 - tx) * ty;
        const w11 = tx * ty;

        const i00 = (y0 * srcW + x0) << 2;
        const i10 = (y0 * srcW + x1) << 2;
        const i01 = (y1 * srcW + x0) << 2;
        const i11 = (y1 * srcW + x1) << 2;

        return [
          data[i00]     * w00 + data[i10]     * w10 + data[i01]     * w01 + data[i11]     * w11,
          data[i00 + 1] * w00 + data[i10 + 1] * w10 + data[i01 + 1] * w01 + data[i11 + 1] * w11,
          data[i00 + 2] * w00 + data[i10 + 2] * w10 + data[i01 + 2] * w01 + data[i11 + 2] * w11
        ];
      };

      const toWorldX = (lx, ly) => cx + lx * cosT - ly * sinT;
      const toWorldY = (lx, ly) => cy + lx * sinT + ly * cosT;

      const invW = aw / sw;
      const invH = ah / sh;

      for (let j = 0; j < sh; j++) {
        const wy = aabb.y + (j + 0.5) * invH;
        for (let i = 0; i < sw; i++) {
          const wx = aabb.x + (i + 0.5) * invW;

          const dx = wx - cx;
          const dy = wy - cy;
          const lx = dx * cosT + dy * sinT;
          const ly = -dx * sinT + dy * cosT;

          const u = (lx + hw) / rectW;
          const v = (ly + hh) / rectH;

          const topLX = lx < -hw ? -hw : (lx > hw ? hw : lx);
          const leftLY = ly < -hh ? -hh : (ly > hh ? hh : ly);

          const tWX = toWorldX(topLX, -hh - sampleDist);
          const tWY = toWorldY(topLX, -hh - sampleDist);
          const cTop = sampleWorld(tWX, tWY);

          const bWX = toWorldX(topLX, hh + sampleDist);
          const bWY = toWorldY(topLX, hh + sampleDist);
          const cBot = sampleWorld(bWX, bWY);

          const lWX = toWorldX(-hw - sampleDist, leftLY);
          const lWY = toWorldY(-hw - sampleDist, leftLY);
          const cLeft = sampleWorld(lWX, lWY);

          const rWX = toWorldX(hw + sampleDist, leftLY);
          const rWY = toWorldY(hw + sampleDist, leftLY);
          const cRight = sampleWorld(rWX, rWY);

          const wt = 1 - v;
          const wb = v;
          const wl = 1 - u;
          const wr = u;

          const r = (cTop[0] * wt + cBot[0] * wb + cLeft[0] * wl + cRight[0] * wr) * 0.5;
          const g = (cTop[1] * wt + cBot[1] * wb + cLeft[1] * wl + cRight[1] * wr) * 0.5;
          const b = (cTop[2] * wt + cBot[2] * wb + cLeft[2] * wl + cRight[2] * wr) * 0.5;

          const o = (j * sw + i) << 2;
          od[o]     = r;
          od[o + 1] = g;
          od[o + 2] = b;
          od[o + 3] = 255;
        }
      }

      ctx.putImageData(out, 0, 0);
      return cnv;
    }

    function getHideFill(a) {
      const key = [
        Math.round(a.x),
        Math.round(a.y),
        Math.round(a.w),
        Math.round(a.h),
        Math.round((a.rotation || 0) * 10)
      ].join('_');

      const cached = hideFillCache.get(a);
      if (cached && cached.key === key) return cached.canvas;

      const canvas = buildHideFillCanvas(a);
      if (!canvas) return null;
      hideFillCache.set(a, { key, canvas });
      return canvas;
    }

    // -------------------------------------------------------------
    // 座標
    // -------------------------------------------------------------
    function getCanvasCoords(e) {
      const rect = annoCanvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return { x: 0, y: 0 };
      const x = (e.clientX - rect.left) * (state.imgWidth / rect.width);
      const y = (e.clientY - rect.top) * (state.imgHeight / rect.height);
      return { x, y };
    }

    function getContainerCoords(e) {
      const rect = editorContainer.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function measureTextAnno(a) {
      measureCtx.font = fontString(a);
      const w = measureCtx.measureText(a.text).width;
      return { w, h: a.size };
    }

    function getRotCenter(a) {
      if (isBoxType(a.type)) {
        return { x: a.x + a.w / 2, y: a.y + a.h / 2 };
      }
      if (a.type === 'text') {
        return { x: a.x, y: a.y };
      }
      return { x: 0, y: 0 };
    }

    function localToWorld(a, px, py) {
      const c = getRotCenter(a);
      const rad = (a.rotation || 0) * Math.PI / 180;
      const dx = px - c.x;
      const dy = py - c.y;
      return {
        x: c.x + dx * Math.cos(rad) - dy * Math.sin(rad),
        y: c.y + dx * Math.sin(rad) + dy * Math.cos(rad)
      };
    }

    function withRotation(ctx, a, fn) {
      const c = getRotCenter(a);
      ctx.save();
      if (a.rotation) {
        ctx.translate(c.x, c.y);
        ctx.rotate((a.rotation * Math.PI) / 180);
        ctx.translate(-c.x, -c.y);
      }
      fn();
      ctx.restore();
    }

    // -------------------------------------------------------------
    // 履歴
    // -------------------------------------------------------------
    function saveHistory() {
      state.history = state.history.slice(0, state.historyIndex + 1);
      state.history.push(JSON.stringify(state.annotations));
      state.historyIndex++;
      updateUndoRedoButtons();
    }

    function undo() {
      if (state.historyIndex > 0) {
        state.historyIndex--;
        state.annotations = JSON.parse(state.history[state.historyIndex]);
        state.selectedId = null;
        updateUI();
        renderAnnotations();
        updateUndoRedoButtons();
      }
    }

    function redo() {
      if (state.historyIndex < state.history.length - 1) {
        state.historyIndex++;
        state.annotations = JSON.parse(state.history[state.historyIndex]);
        state.selectedId = null;
        updateUI();
        renderAnnotations();
        updateUndoRedoButtons();
      }
    }

    function updateUndoRedoButtons() {
      btnUndo.disabled = state.historyIndex <= 0;
      btnRedo.disabled = state.historyIndex >= state.history.length - 1;
    }

    btnUndo.addEventListener('click', undo);
    btnRedo.addEventListener('click', redo);

    // -------------------------------------------------------------
    // ポインター
    // -------------------------------------------------------------
    let activePointers = new Map();
    let isDrawing = false;
    let isDraggingObj = false;
    let isTransformingObj = false;
    let isPanning = false;
    let isPinching = false;
    let wasPinchingGesture = false;
    let panMoved = false;
    let pendingSelectId = null;

    let transformHandle = null;
    let currentAnnotation = null;
    let startImageCoords = { x: 0, y: 0 };
    let initialObjState = null;

    let panStart = { x: 0, y: 0 };
    let panStartPan = { x: 0, y: 0 };

    let initialPinchDist = 1;
    let initialScale = 1;
    let initialImgAnchor = { x: 0, y: 0 };

    let initialRotCenter = { x: 0, y: 0 };
    let initialHandleAngle = 0;
    let initialRotation = 0;

    function startPinch() {
      const pts = Array.from(activePointers.values());
      if (pts.length < 2) return;
      wasPinchingGesture = true;
      const cRect = editorContainer.getBoundingClientRect();
      const mid = {
        x: (pts[0].x + pts[1].x) / 2 - cRect.left,
        y: (pts[0].y + pts[1].y) / 2 - cRect.top
      };
      initialPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
      initialScale = state.scale;
      initialImgAnchor = {
        x: (mid.x - state.panX) / state.scale,
        y: (mid.y - state.panY) / state.scale
      };
      isPinching = true;
    }

    function cancelActiveGesture() {
      if (isDrawing && currentAnnotation) {
        state.annotations = state.annotations.filter(a => a.id !== currentAnnotation.id);
        currentAnnotation = null;
      }
      isDrawing = false;
      isDraggingObj = false;
      isTransformingObj = false;
      isPanning = false;
      panMoved = false;
      pendingSelectId = null;
      transformHandle = null;
      initialObjState = null;
    }

    editorContainer.addEventListener('pointerdown', (e) => {
      if (!state.image) return;

      try {
        e.target.setPointerCapture(e.pointerId);
      } catch (err) {}

      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (activePointers.size === 2) {
        cancelActiveGesture();
        startPinch();
        return;
      }
      if (activePointers.size > 2) return;

      wasPinchingGesture = false;
      const coords = getCanvasCoords(e);
      startImageCoords = coords;

      if (state.selectedId) {
        const selectedAnno = state.annotations.find(a => a.id === state.selectedId);
        if (selectedAnno) {
          const handle = getHitHandle(coords, selectedAnno);
          if (handle) {
            isTransformingObj = true;
            transformHandle = handle;
            initialObjState = JSON.parse(JSON.stringify(selectedAnno));
            if (handle === 'rot') {
              initialRotCenter = getRotCenter(selectedAnno);
              const rotH = getHandles(selectedAnno).find(h => h.id === 'rot');
              if (rotH) {
                initialHandleAngle = Math.atan2(
                  rotH.y - initialRotCenter.y,
                  rotH.x - initialRotCenter.x
                );
              }
              initialRotation = selectedAnno.rotation || 0;
            }
            return;
          }
        }
      }

      if (state.activeTool !== 'select') {
        const id = Date.now().toString() + Math.random().toString(36).slice(2, 6);

        if (state.activeTool === 'text') {
          const newAnno = {
            id, type: 'text',
            x: coords.x, y: coords.y,
            text: state.defaults.text,
            color: state.defaults.color,
            size: state.defaults.textSize,
            isBold: state.defaults.isBold,
            shadow: state.defaults.shadow,
            outlineWidth: state.defaults.outlineWidth,
            fontFamily: state.defaults.fontFamily,
            rotation: 0
          };
          state.annotations.push(newAnno);
          pendingSelectId = id;
          bringToFront(id);
          saveHistory();
          switchTool('select');
          renderAnnotations();
          updateUI();
          return;
        }

        if (state.activeTool === 'rect') {
          isDrawing = true;
          currentAnnotation = {
            id, type: 'rect',
            x: coords.x, y: coords.y,
            w: 1, h: 1,
            color: state.defaults.color,
            strokeWidth: state.defaults.strokeWidth,
            outlineWidth: state.defaults.outlineWidth,
            borderRadius: state.defaults.borderRadius,
            shadow: state.defaults.shadow,
            rotation: 0
          };
          state.annotations.push(currentAnnotation);
          pendingSelectId = id;
          bringToFront(id);
          renderAnnotations();
          return;
        }

        if (state.activeTool === 'hide') {
          isDrawing = true;
          currentAnnotation = {
            id, type: 'hide',
            x: coords.x, y: coords.y,
            w: 1, h: 1,
            rotation: 0
          };
          state.annotations.push(currentAnnotation);
          pendingSelectId = id;
          bringToFront(id);
          renderAnnotations();
          return;
        }

        if (state.activeTool === 'arrow') {
          isDrawing = true;
          currentAnnotation = {
            id, type: 'arrow',
            x1: coords.x, y1: coords.y,
            x2: coords.x + 1, y2: coords.y + 1,
            color: state.defaults.color,
            strokeWidth: state.defaults.strokeWidth,
            outlineWidth: state.defaults.outlineWidth,
            arrowSize: state.defaults.arrowSize,
            arrowEnds: state.defaults.arrowEnds,
            shadow: state.defaults.shadow
          };
          state.annotations.push(currentAnnotation);
          pendingSelectId = id;
          bringToFront(id);
          renderAnnotations();
          return;
        }
      }

      const hitAnno = getHitAnnotation(coords);
      if (hitAnno) {
        pendingSelectId = hitAnno.id;
        bringToFront(hitAnno.id);
        isDraggingObj = true;
        initialObjState = JSON.parse(JSON.stringify(hitAnno));
      } else {
        pendingSelectId = null;
        isPanning = true;
        panMoved = false;
        panStart = getContainerCoords(e);
        panStartPan = { x: state.panX, y: state.panY };
      }
    });

    editorContainer.addEventListener('pointermove', (e) => {
      if (!activePointers.has(e.pointerId)) return;
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (activePointers.size === 2) {
        if (!isPinching) startPinch();
        const pts = Array.from(activePointers.values());
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
        let newScale = initialScale * (dist / initialPinchDist);
        newScale = Math.max(0.05, Math.min(20, newScale));

        const cRect = editorContainer.getBoundingClientRect();
        const mid = {
          x: (pts[0].x + pts[1].x) / 2 - cRect.left,
          y: (pts[0].y + pts[1].y) / 2 - cRect.top
        };

        state.scale = newScale;
        state.panX = mid.x - initialImgAnchor.x * newScale;
        state.panY = mid.y - initialImgAnchor.y * newScale;

        updateViewportTransform();
        return;
      }

      if (activePointers.size > 1) return;

      if (isPanning) {
        const c = getContainerCoords(e);
        const dx = c.x - panStart.x;
        const dy = c.y - panStart.y;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) panMoved = true;
        state.panX = panStartPan.x + dx;
        state.panY = panStartPan.y + dy;
        updateViewportTransform();
        return;
      }

      const coords = getCanvasCoords(e);

      if (isDrawing && currentAnnotation) {
        if (currentAnnotation.type === 'rect' || currentAnnotation.type === 'hide') {
          currentAnnotation.w = coords.x - startImageCoords.x;
          currentAnnotation.h = coords.y - startImageCoords.y;
        } else if (currentAnnotation.type === 'arrow') {
          currentAnnotation.x2 = coords.x;
          currentAnnotation.y2 = coords.y;
        }
        renderAnnotations();
        return;
      }

      const selectedAnno = state.annotations.find(a => a.id === (state.selectedId || pendingSelectId));
      if (!selectedAnno) return;

      if (isTransformingObj && initialObjState) {
        const dx = coords.x - startImageCoords.x;
        const dy = coords.y - startImageCoords.y;

        if (isBoxType(selectedAnno.type)) {
          if (transformHandle === 'rot') {
            const cur = Math.atan2(
              coords.y - initialRotCenter.y,
              coords.x - initialRotCenter.x
            );
            const raw = initialRotation + (cur - initialHandleAngle) * (180 / Math.PI);
            selectedAnno.rotation = snapRotation(raw);
          } else {
            applyRectResize(selectedAnno, initialObjState, transformHandle, dx, dy);
          }
        } else if (selectedAnno.type === 'arrow') {
          if (transformHandle === 'p1') {
            selectedAnno.x1 = coords.x;
            selectedAnno.y1 = coords.y;
          } else if (transformHandle === 'p2') {
            selectedAnno.x2 = coords.x;
            selectedAnno.y2 = coords.y;
          }
        } else if (selectedAnno.type === 'text') {
          if (transformHandle === 'rot') {
            const cur = Math.atan2(
              coords.y - initialRotCenter.y,
              coords.x - initialRotCenter.x
            );
            const raw = initialRotation + (cur - initialHandleAngle) * (180 / Math.PI);
            selectedAnno.rotation = snapRotation(raw);
          }
        }
        renderAnnotations();
        return;
      }

      if (isDraggingObj && initialObjState) {
        const dx = coords.x - startImageCoords.x;
        const dy = coords.y - startImageCoords.y;

        if (isBoxType(selectedAnno.type) || selectedAnno.type === 'text') {
          selectedAnno.x = initialObjState.x + dx;
          selectedAnno.y = initialObjState.y + dy;
        } else if (selectedAnno.type === 'arrow') {
          selectedAnno.x1 = initialObjState.x1 + dx;
          selectedAnno.y1 = initialObjState.y1 + dy;
          selectedAnno.x2 = initialObjState.x2 + dx;
          selectedAnno.y2 = initialObjState.y2 + dy;
        }
        renderAnnotations();
      }
    });

    function applyRectResize(target, s, handle, dx, dy) {
      const th = (s.rotation || 0) * Math.PI / 180;
      const cos = Math.cos(-th), sin = Math.sin(-th);
      const ldx = dx * cos - dy * sin;
      const ldy = dx * sin + dy * cos;

      let nw = s.w;
      let nh = s.h;
      if (handle === 'se') { nw = s.w + ldx; nh = s.h + ldy; }
      else if (handle === 'nw') { nw = s.w - ldx; nh = s.h - ldy; }
      else if (handle === 'ne') { nw = s.w + ldx; nh = s.h - ldy; }
      else if (handle === 'sw') { nw = s.w - ldx; nh = s.h + ldy; }

      nw = Math.max(10, nw);
      nh = Math.max(10, nh);

      if (s.type === 'image' && s.aspect) {
        const wFromH = nh * s.aspect;
        nw = (Math.abs(nw - s.w) >= Math.abs(wFromH - s.w)) ? nw : wFromH;
        nw = Math.max(20, nw);
        nh = nw / s.aspect;
      }

      let anchorLocalX, anchorLocalY;
      if (handle === 'se') { anchorLocalX = s.x; anchorLocalY = s.y; }
      else if (handle === 'nw') { anchorLocalX = s.x + s.w; anchorLocalY = s.y + s.h; }
      else if (handle === 'ne') { anchorLocalX = s.x; anchorLocalY = s.y + s.h; }
      else { anchorLocalX = s.x + s.w; anchorLocalY = s.y; }

      const A = localToWorld(s, anchorLocalX, anchorLocalY);

      let ax, ay;
      if (handle === 'se') { ax = -nw / 2; ay = -nh / 2; }
      else if (handle === 'nw') { ax = nw / 2; ay = nh / 2; }
      else if (handle === 'ne') { ax = -nw / 2; ay = nh / 2; }
      else { ax = nw / 2; ay = -nh / 2; }

      const c = Math.cos(th), sn = Math.sin(th);
      const rx = ax * c - ay * sn;
      const ry = ax * sn + ay * c;

      target.w = nw;
      target.h = nh;
      if (s.type === 'image') target.aspect = nw / nh;
      target.x = (A.x - rx) - nw / 2;
      target.y = (A.y - ry) - nh / 2;
    }

    const handlePointerUp = (e) => {
      try {
        if (e.target.hasPointerCapture(e.pointerId)) {
          e.target.releasePointerCapture(e.pointerId);
        }
      } catch (err) {}

      const wasPinching = isPinching;
      activePointers.delete(e.pointerId);

      if (wasPinching) {
        if (activePointers.size < 2) isPinching = false;
        return;
      }

      if (wasPinchingGesture) {
        wasPinchingGesture = false;
        return;
      }

      if (isPanning) {
        if (!panMoved) {
          state.selectedId = null;
        }
        isPanning = false;
        panMoved = false;
        updateUI();
        renderAnnotations();
        return;
      }

      if (pendingSelectId) {
        state.selectedId = pendingSelectId;
        pendingSelectId = null;
      }

      if (isDrawing || isDraggingObj || isTransformingObj) {
        let discard = false;

        if (currentAnnotation &&
            (currentAnnotation.type === 'rect' || currentAnnotation.type === 'hide')) {
          if (currentAnnotation.w < 0) {
            currentAnnotation.x += currentAnnotation.w;
            currentAnnotation.w = Math.abs(currentAnnotation.w);
          }
          if (currentAnnotation.h < 0) {
            currentAnnotation.y += currentAnnotation.h;
            currentAnnotation.h = Math.abs(currentAnnotation.h);
          }
        }

        if (isDrawing && currentAnnotation) {
          const a = currentAnnotation;
          if (a.type === 'rect' || a.type === 'hide') {
            discard = Math.abs(a.w) < 8 || Math.abs(a.h) < 8;
          } else if (a.type === 'arrow') {
            discard = Math.hypot(a.x2 - a.x1, a.y2 - a.y1) < 8;
          }
          if (discard) {
            state.annotations = state.annotations.filter(x => x.id !== a.id);
            state.selectedId = null;
          }
        }

        if (!discard) {
          saveHistory();
          if (isDrawing) {
            switchTool('select');
          }
        }
      }

      updateUI();
      renderAnnotations();

      isDrawing = false;
      isDraggingObj = false;
      isTransformingObj = false;
      transformHandle = null;
      currentAnnotation = null;
      initialObjState = null;
    };

    editorContainer.addEventListener('pointerup', handlePointerUp);
    editorContainer.addEventListener('pointercancel', handlePointerUp);
    editorContainer.addEventListener('pointerleave', (e) => {
      if (activePointers.has(e.pointerId)) handlePointerUp(e);
    });

    // -------------------------------------------------------------
    // ヒットテスト
    // -------------------------------------------------------------
    function getHitAnnotation(coords) {
      for (let i = state.annotations.length - 1; i >= 0; i--) {
        const a = state.annotations[i];

        if (isBoxType(a.type)) {
          const c = getRotCenter(a);
          const rad = -(a.rotation || 0) * Math.PI / 180;
          const dx = coords.x - c.x;
          const dy = coords.y - c.y;
          const lx = c.x + dx * Math.cos(rad) - dy * Math.sin(rad);
          const ly = c.y + dx * Math.sin(rad) + dy * Math.cos(rad);

          const minX = Math.min(a.x, a.x + a.w);
          const maxX = Math.max(a.x, a.x + a.w);
          const minY = Math.min(a.y, a.y + a.h);
          const maxY = Math.max(a.y, a.y + a.h);

          // 「隠す」は枠内タップでも選択されやすいよう判定マージンを広めに
          const margin = (a.type === 'hide' ? 30 : 15) / state.scale;

          if (lx >= minX - margin && lx <= maxX + margin &&
              ly >= minY - margin && ly <= maxY + margin) {
            return a;
          }
        } else if (a.type === 'arrow') {
          const dist = distToSegment(coords, { x: a.x1, y: a.y1 }, { x: a.x2, y: a.y2 });
          if (dist < (a.strokeWidth / 2 + 24 / state.scale)) return a;
        } else if (a.type === 'text') {
          const m = measureTextAnno(a);
          const w = Math.max(m.w, a.size * 0.6);
          const h = Math.max(a.size, 12);

          const c = getRotCenter(a);
          const rad = -(a.rotation || 0) * Math.PI / 180;
          const dx = coords.x - c.x;
          const dy = coords.y - c.y;
          const lx = c.x + dx * Math.cos(rad) - dy * Math.sin(rad);
          const ly = c.y + dx * Math.sin(rad) + dy * Math.cos(rad);

          const margin = 15 / state.scale;
          if (lx >= a.x - w/2 - margin && lx <= a.x + w/2 + margin &&
              ly >= a.y - h/2 - margin && ly <= a.y + h/2 + margin) {
            return a;
          }
        }
      }
      return null;
    }

    function getHandles(a) {
      const handles = [];
      const off = 34 / state.scale;

      if (isBoxType(a.type)) {
        const corners = [
          { id: 'nw', x: a.x, y: a.y },
          { id: 'ne', x: a.x + a.w, y: a.y },
          { id: 'se', x: a.x + a.w, y: a.y + a.h },
          { id: 'sw', x: a.x, y: a.y + a.h }
        ];
        corners.forEach(p => {
          const w = localToWorld(a, p.x, p.y);
          handles.push({ id: p.id, x: w.x, y: w.y });
        });
        const r = localToWorld(a, a.x + a.w / 2, a.y - off);
        handles.push({ id: 'rot', x: r.x, y: r.y });
      } else if (a.type === 'text') {
        const topY = a.y - a.size / 2;
        const r = localToWorld(a, a.x, topY - off);
        handles.push({ id: 'rot', x: r.x, y: r.y });
      } else if (a.type === 'arrow') {
        handles.push({ id: 'p1', x: a.x1, y: a.y1 });
        handles.push({ id: 'p2', x: a.x2, y: a.y2 });
      }
      return handles;
    }

    function getHitHandle(coords, a) {
      const handleSize = 26 / state.scale;
      const handles = getHandles(a);
      for (const h of handles) {
        if (Math.hypot(coords.x - h.x, coords.y - h.y) < handleSize) {
          return h.id;
        }
      }
      return null;
    }

    function distToSegment(p, v, w) {
      const l2 = (v.x - w.x) ** 2 + (v.y - w.y) ** 2;
      if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
      let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }

    // -------------------------------------------------------------
    // 描画
    // -------------------------------------------------------------
    function applyShadow(ctx, a) {
      if (a.shadow && a.shadow > 0) {
        ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
        ctx.shadowBlur = a.shadow;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;
      }
    }

    function renderAnnotations() {
      annoCtx.clearRect(0, 0, annoCanvas.width, annoCanvas.height);

      state.annotations.forEach(a => {
        if (a.type === 'rect') {
          annoCtx.save();
          applyShadow(annoCtx, a);
          drawRoundedRect(annoCtx, a);
          annoCtx.restore();
        } else if (a.type === 'hide') {
          drawHide(annoCtx, a);
        } else if (a.type === 'arrow') {
          annoCtx.save();
          applyShadow(annoCtx, a);
          drawArrow(annoCtx, a);
          annoCtx.restore();
        } else if (a.type === 'text') {
          drawText(annoCtx, a);
        } else if (a.type === 'image') {
          annoCtx.save();
          applyShadow(annoCtx, a);
          drawImageAnno(annoCtx, a);
          annoCtx.restore();
        }

        if (a.id === state.selectedId) {
          drawSelectionBounds(a);
        }
      });
    }

    function drawRoundedRect(ctx, a) {
      withRotation(ctx, a, () => {
        const x0 = Math.min(a.x, a.x + a.w);
        const y0 = Math.min(a.y, a.y + a.h);
        const w = Math.abs(a.w);
        const h = Math.abs(a.h);
        const maxR = Math.min(w, h) / 2;
        const pct = (a.borderRadius != null ? a.borderRadius : 0) / 100;
        const r = Math.max(0, Math.min(maxR, maxR * pct));

        pathRoundedRect(ctx, x0, y0, w, h, r);

        ctx.lineJoin = 'round';

        const outline = a.outlineWidth != null ? a.outlineWidth : 2;
        if (outline > 0) {
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = a.strokeWidth + outline * 2;
          ctx.stroke();
        }

        ctx.strokeStyle = a.color;
        ctx.lineWidth = a.strokeWidth;
        ctx.stroke();
      });
    }

    // 「隠す」: 生成済みの塗り画像を、回転クリップを通してAABBへ描画
    // 角丸は廃止（常に r = 0）
    function drawHide(ctx, a) {
      const x0 = Math.min(a.x, a.x + a.w);
      const y0 = Math.min(a.y, a.y + a.h);
      const w = Math.abs(a.w);
      const h = Math.abs(a.h);
      if (w < 0.5 || h < 0.5) return;

      const fill = getHideFill(a);
      if (!fill || !fill.width) return;

      const aabb = getRotatedAABB(a);
      const rad = (a.rotation || 0) * Math.PI / 180;
      const c = getRotCenter(a);

      ctx.save();
      if (a.rotation) {
        ctx.translate(c.x, c.y);
        ctx.rotate(rad);
        ctx.translate(-c.x, -c.y);
      }
      pathRoundedRect(ctx, x0, y0, w, h, 0);
      ctx.clip();

      ctx.save();
      if (a.rotation) {
        ctx.translate(c.x, c.y);
        ctx.rotate(-rad);
        ctx.translate(-c.x, -c.y);
      }
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(fill, 0, 0, fill.width, fill.height, aabb.x, aabb.y, aabb.w, aabb.h);
      ctx.restore();

      ctx.restore();
    }

    function drawImageAnno(ctx, a) {
      const img = imageRegistry.get(a.srcKey);
      if (!img) return;

      withRotation(ctx, a, () => {
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, a.x, a.y, a.w, a.h);
      });
    }

    function drawArrow(ctx, a) {
      const angle = Math.atan2(a.y2 - a.y1, a.x2 - a.x1);
      const headLen = a.arrowSize || 20;
      const useEnds = a.arrowEnds === true;

      const drawPath = () => {
        ctx.beginPath();
        if (useEnds) {
          ctx.moveTo(a.x1, a.y1);
          ctx.lineTo(a.x2, a.y2);

          const perp = angle + Math.PI / 2;
          const hx = Math.cos(perp) * headLen / 2;
          const hy = Math.sin(perp) * headLen / 2;

          ctx.moveTo(a.x1 - hx, a.y1 - hy);
          ctx.lineTo(a.x1 + hx, a.y1 + hy);

          ctx.moveTo(a.x2 - hx, a.y2 - hy);
          ctx.lineTo(a.x2 + hx, a.y2 + hy);
        } else {
          ctx.moveTo(a.x1, a.y1);
          ctx.lineTo(a.x2, a.y2);
          ctx.lineTo(
            a.x2 - headLen * Math.cos(angle - Math.PI / 6),
            a.y2 - headLen * Math.sin(angle - Math.PI / 6)
          );
          ctx.moveTo(a.x2, a.y2);
          ctx.lineTo(
            a.x2 - headLen * Math.cos(angle + Math.PI / 6),
            a.y2 - headLen * Math.sin(angle + Math.PI / 6)
          );
        }
      };

      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const outline = a.outlineWidth != null ? a.outlineWidth : 2;
      if (outline > 0) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = a.strokeWidth + outline * 2;
        drawPath();
        ctx.stroke();
      }

      ctx.strokeStyle = a.color;
      ctx.lineWidth = a.strokeWidth;
      drawPath();
      ctx.stroke();
    }

    function drawText(ctx, a) {
      withRotation(ctx, a, () => {
        ctx.font = fontString(a);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';

        const outline = (a.outlineWidth != null) ? a.outlineWidth : 0;
        const shadow = (a.shadow != null) ? a.shadow : 0;

        if (shadow > 0) {
          ctx.save();
          applyShadow(ctx, a);

          if (outline > 0) {
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = outline * 2;
            ctx.strokeText(a.text, a.x, a.y);
          }
          ctx.fillStyle = a.color;
          ctx.fillText(a.text, a.x, a.y);
          ctx.restore();
        }

        if (outline > 0) {
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = outline * 2;
          ctx.strokeText(a.text, a.x, a.y);
        }
        ctx.fillStyle = a.color;
        ctx.fillText(a.text, a.x, a.y);
      });
    }

    function drawSelectionBounds(a) {
      annoCtx.save();
      annoCtx.strokeStyle = '#0a84ff';
      annoCtx.lineWidth = 2 / state.scale;
      annoCtx.fillStyle = '#ffffff';
      annoCtx.setLineDash([]);

      const handleR = 7 / state.scale;

      if (isBoxType(a.type)) {
        withRotation(annoCtx, a, () => {
          annoCtx.strokeRect(a.x, a.y, a.w, a.h);
        });
      } else if (a.type === 'text') {
        const m = measureTextAnno(a);
        withRotation(annoCtx, a, () => {
          annoCtx.strokeRect(a.x - m.w / 2 - 4, a.y - a.size / 2 - 4, m.w + 8, a.size + 8);
        });
      }

      const handles = getHandles(a);
      handles.forEach(h => {
        if (h.id === 'rot') {
          let base;
          if (isBoxType(a.type)) {
            base = localToWorld(a, a.x + a.w / 2, a.y);
          } else {
            base = localToWorld(a, a.x, a.y - a.size / 2);
          }

          annoCtx.beginPath();
          annoCtx.moveTo(base.x, base.y);
          annoCtx.lineTo(h.x, h.y);
          annoCtx.strokeStyle = '#0a84ff';
          annoCtx.lineWidth = 2 / state.scale;
          annoCtx.stroke();

          annoCtx.beginPath();
          annoCtx.arc(h.x, h.y, handleR + 2 / state.scale, 0, Math.PI * 2);
          annoCtx.fillStyle = '#0a84ff';
          annoCtx.fill();
          annoCtx.strokeStyle = '#ffffff';
          annoCtx.lineWidth = 2 / state.scale;
          annoCtx.stroke();

          annoCtx.beginPath();
          annoCtx.arc(h.x, h.y, handleR * 0.45, 0.4, Math.PI * 1.6);
          annoCtx.strokeStyle = '#ffffff';
          annoCtx.lineWidth = 1.6 / state.scale;
          annoCtx.stroke();
        } else {
          annoCtx.beginPath();
          annoCtx.arc(h.x, h.y, handleR, 0, Math.PI * 2);
          annoCtx.fillStyle = '#ffffff';
          annoCtx.fill();
          annoCtx.strokeStyle = '#0a84ff';
          annoCtx.lineWidth = 2 / state.scale;
          annoCtx.stroke();
        }
      });

      annoCtx.restore();
    }

    // -------------------------------------------------------------
    // UI 同期
    // -------------------------------------------------------------
    function updateUI() {

      if (!a) {

      document.getElementById('font-prop-row').style.display = (a.type === 'text') ? 'flex' : 'none';

      // 角丸スライダーは「四角」のみ表示（「隠す」は廃止）
      document.getElementById('radius-prop-row').style.display =
        (a.type === 'rect') ? 'flex' : 'none';
      document.getElementById('arrow-prop-row').style.display = (a.type === 'arrow') ? 'flex' : 'none';
      document.getElementById('size-prop-row').style.display =
        (a.type === 'hide' || a.type === 'image') ? 'none' : 'flex';
      document.getElementById('shadow-prop-row').style.display =
        (a.type === 'hide') ? 'none' : 'flex';
      document.getElementById('image-prop-row').style.display =
        (a.type === 'image') ? 'flex' : 'none';

      if (a.type === 'text') {

      } else if (a.type === 'rect' || a.type === 'arrow') {
