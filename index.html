      }

      setSliderRange(outlineSlider, state.ranges.outlineWidth, a.outlineWidth != null ? a.outlineWidth : 0);
      setSliderRange(shadowSlider, state.ranges.shadow, a.shadow != null ? a.shadow : 0);

      if (a.type === 'rect') {
        radiusSlider.value = (a.borderRadius != null) ? a.borderRadius : 0;
      }

      if (a.type === 'arrow') {
        setSliderRange(arrowSlider, state.ranges.arrowSize, a.arrowSize || state.ranges.arrowSize.min);
        btnArrowEnds.classList.toggle('active', !!a.arrowEnds);
      }

      if (a.type === 'image') {
        btnBgConnected.classList.toggle('active', state.bgRemoveConnected);
      }
    }

    function switchTool(tool) {
      state.activeTool = tool;
      document.querySelectorAll('.tool-item[data-tool]').forEach(b => {
        b.classList.toggle('active', b.dataset.tool === tool);
      });
    }

    function selectColor(color) {
      state.defaults.color = color;
      const selectedAnno = state.annotations.find(a => a.id === state.selectedId);
      if (selectedAnno && selectedAnno.type !== 'image') {
        selectedAnno.color = color;
        saveHistory();
        renderAnnotations();
      }
      updateUI();
    }

    // -------------------------------------------------------------
    // 背景削除
    // -------------------------------------------------------------
    function removeImageBackground(anno, connectedOnly) {
      const img = imageRegistry.get(anno.srcKey);
      if (!img) return false;

      const iw = img.naturalWidth || img.width;
      const ih = img.naturalHeight || img.height;
      if (!iw || !ih) return false;

      const cnv = document.createElement('canvas');
      cnv.width = iw;
      cnv.height = ih;
      const ctx = cnv.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);

      let imageData;
      try {
        imageData = ctx.getImageData(0, 0, iw, ih);
      } catch (e) {
        return false;
      }

      const data = imageData.data;

      const samplePatch = (cx, cy) => {
        let r = 0, g = 0, b = 0, n = 0;
        for (let dy = -2; dy <= 2; dy++) {
          for (let dx = -2; dx <= 2; dx++) {
            const x = clampI(cx + dx, 0, iw - 1);
            const y = clampI(cy + dy, 0, ih - 1);
            const idx = (y * iw + x) * 4;
            if (data[idx + 3] < 128) continue;
            r += data[idx];
            g += data[idx + 1];
            b += data[idx + 2];
            n++;
          }
        }
        if (n === 0) return null;
        return [r / n, g / n, b / n];
      };

      const patches = [
        samplePatch(2, 2),
        samplePatch(iw - 3, 2),
        samplePatch(2, ih - 3),
        samplePatch(iw - 3, ih - 3)
      ].filter(Boolean);

      if (patches.length === 0) return false;

      let bgR = 0, bgG = 0, bgB = 0;
      for (const p of patches) { bgR += p[0]; bgG += p[1]; bgB += p[2]; }
      bgR /= patches.length;
      bgG /= patches.length;
      bgB /= patches.length;

      const isLightBg = ((bgR + bgG + bgB) / 3) > 200;
      const lowThreshold = isLightBg ? 15 : 25;
      const highThreshold = isLightBg ? 60 : 90;
      const connectThreshold = lowThreshold + (highThreshold - lowThreshold) * 0.4;

      const computeAlpha = (dist) => {
        if (dist <= lowThreshold) return 0;
        if (dist >= highThreshold) return 255;
        const t = (dist - lowThreshold) / (highThreshold - lowThreshold);
        const s = t * t * (3 - 2 * t);
        return Math.round(255 * s);
      };

      if (connectedOnly) {
        const visited = new Uint8Array(iw * ih);
        const queue = [];

        const isConnectable = (idx) => {
          const dr = data[idx] - bgR;
          const dg = data[idx + 1] - bgG;
          const db = data[idx + 2] - bgB;
          const dist = Math.sqrt(dr * dr + dg * dg + db * db);
          return dist <= connectThreshold;
        };

        for (let x = 0; x < iw; x++) {
          for (const y of [0, ih - 1]) {
            const p = y * iw + x;
            if (!visited[p] && data[p * 4 + 3] > 0 && isConnectable(p * 4)) {
              visited[p] = 1;
              queue.push(p);
            }
          }
        }
        for (let y = 1; y < ih - 1; y++) {
          for (const x of [0, iw - 1]) {
            const p = y * iw + x;
            if (!visited[p] && data[p * 4 + 3] > 0 && isConnectable(p * 4)) {
              visited[p] = 1;
              queue.push(p);
            }
          }
        }

        let head = 0;
        while (head < queue.length) {
          const p = queue[head++];
          const x = p % iw;
          const y = (p / iw) | 0;

          if (x > 0) {
            const np = p - 1;
            if (!visited[np] && data[np * 4 + 3] > 0 && isConnectable(np * 4)) {
              visited[np] = 1; queue.push(np);
            }
          }
          if (x < iw - 1) {
            const np = p + 1;
            if (!visited[np] && data[np * 4 + 3] > 0 && isConnectable(np * 4)) {
              visited[np] = 1; queue.push(np);
            }
          }
          if (y > 0) {
            const np = p - iw;
            if (!visited[np] && data[np * 4 + 3] > 0 && isConnectable(np * 4)) {
              visited[np] = 1; queue.push(np);
            }
          }
          if (y < ih - 1) {
            const np = p + iw;
            if (!visited[np] && data[np * 4 + 3] > 0 && isConnectable(np * 4)) {
              visited[np] = 1; queue.push(np);
            }
          }
        }

        for (let p = 0; p < visited.length; p++) {
          if (!visited[p]) continue;
          const idx = p * 4;
          const a0 = data[idx + 3];
          if (a0 === 0) continue;

          const dr = data[idx] - bgR;
          const dg = data[idx + 1] - bgG;
          const db = data[idx + 2] - bgB;
          const dist = Math.sqrt(dr * dr + dg * dg + db * db);
          const newAlpha = computeAlpha(dist);
          data[idx + 3] = Math.round(a0 * newAlpha / 255);
        }
      } else {
        for (let i = 0; i < data.length; i += 4) {
          const a0 = data[i + 3];
          if (a0 === 0) continue;

          const dr = data[i] - bgR;
          const dg = data[i + 1] - bgG;
          const db = data[i + 2] - bgB;
          const dist = Math.sqrt(dr * dr + dg * dg + db * db);
          const newAlpha = computeAlpha(dist);
          data[i + 3] = Math.round(a0 * newAlpha / 255);
        }
      }

      ctx.putImageData(imageData, 0, 0);

      const newKey = 'img_' + (++imageKeyCounter);
      const newImg = new Image();
      newImg.onload = () => {
        imageRegistry.set(newKey, newImg);
        anno.srcKey = newKey;
        renderAnnotations();
        saveHistory();
      };
      newImg.src = cnv.toDataURL('image/png');

      return true;
    }

    btnBgRemove.addEventListener('click', () => {
      const a = state.annotations.find(x => x.id === state.selectedId);
      if (!a || a.type !== 'image') return;
      btnBgRemove.disabled = true;
      const ok = removeImageBackground(a, state.bgRemoveConnected);
      setTimeout(() => { btnBgRemove.disabled = false; }, 400);
      if (!ok) btnBgRemove.disabled = false;
    });

    btnBgConnected.addEventListener('click', () => {
      state.bgRemoveConnected = !state.bgRemoveConnected;
      btnBgConnected.classList.toggle('active', state.bgRemoveConnected);
    });

    // -------------------------------------------------------------
    // 複製
    // -------------------------------------------------------------
    function duplicateSelected() {
      const a = state.annotations.find(x => x.id === state.selectedId);
      if (!a) return;

      const newAnno = JSON.parse(JSON.stringify(a));
      newAnno.id = Date.now().toString() + Math.random().toString(36).slice(2, 6);

      const offset = Math.max(10, 24 / state.scale);
      if (isBoxType(newAnno.type) || newAnno.type === 'text') {
        newAnno.x += offset;
        newAnno.y += offset;
      } else if (newAnno.type === 'arrow') {
        newAnno.x1 += offset;
        newAnno.y1 += offset;
        newAnno.x2 += offset;
        newAnno.y2 += offset;
      }

      state.annotations.push(newAnno);
      state.selectedId = newAnno.id;
      bringToFront(newAnno.id);
      updateUI();
      renderAnnotations();
      saveHistory();
    }

    btnDuplicate.addEventListener('click', duplicateSelected);

        renderAnnotations();
      }

      const a = state.annotations.find(x => x.id === state.selectedId);
      if (a && a.type === 'text') {
        a.text = '';

        textContentInput.focus();

    btnAspectSquare.addEventListener('click', () => {
      const a = state.annotations.find(x => x.id === state.selectedId);
      if (a && (a.type === 'rect' || a.type === 'hide')) {
        const minSide = Math.min(Math.abs(a.w), Math.abs(a.h));
        const cx = a.x + a.w / 2;
        const cy = a.y + a.h / 2;
        const signW = a.w < 0 ? -1 : 1;
        const signH = a.h < 0 ? -1 : 1;
        a.w = minSide * signW;
        a.h = minSide * signH;
        a.x = cx - a.w / 2;
        a.y = cy - a.h / 2;
        saveHistory();
        renderAnnotations();
      }
    });

    // -------------------------------------------------------------
    // 微調整ボタン
    // -------------------------------------------------------------
    function applyNudge(dx, dy) {
      const a = state.annotations.find(x => x.id === state.selectedId);
      if (!a) return;
      if (isBoxType(a.type) || a.type === 'text') {
        a.x += dx;
        a.y += dy;
      } else if (a.type === 'arrow') {
        a.x1 += dx;
        a.y1 += dy;
        a.x2 += dx;
        a.y2 += dy;
      }
      renderAnnotations();
    }

    function setupNudgeButtons() {
      const defs = [
        { id: 'nudge-left', dx: -2, dy: 0 },
        { id: 'nudge-right', dx: 2, dy: 0 },
        { id: 'nudge-up', dx: 0, dy: -2 },
        { id: 'nudge-down', dx: 0, dy: 2 }
      ];

      defs.forEach(({ id, dx, dy }) => {
        const btn = document.getElementById(id);
        let holdTimer = null;
        let repeatTimer = null;
        let active = false;

        const stop = () => {
          if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
          if (repeatTimer) { clearInterval(repeatTimer); repeatTimer = null; }
          if (active) {
            active = false;
            saveHistory();
          }
        };

        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          if (!state.selectedId) return;
          active = true;
          applyNudge(dx, dy);
          holdTimer = setTimeout(() => {
            repeatTimer = setInterval(() => applyNudge(dx, dy), 55);
          }, 380);
        });
        btn.addEventListener('pointerup', stop);
        btn.addEventListener('pointercancel', stop);
        btn.addEventListener('pointerleave', stop);
      });
    }

    btnDelete.addEventListener('click', () => {
      if (state.selectedId) {
        state.annotations = state.annotations.filter(a => a.id !== state.selectedId);
        state.selectedId = null;
        updateUI();
        saveHistory();
        renderAnnotations();
      }
    });

    // -------------------------------------------------------------
    // エクスポート / 共有 / コピー
    // -------------------------------------------------------------
    let previewObjectURL = null;
    let previewBlob = null;

    function releasePreviewObjectURL() {
      if (previewObjectURL) {
        try { URL.revokeObjectURL(previewObjectURL); } catch (e) {}
        previewObjectURL = null;
      }
    }

    function showSavePreview(url, blob) {
      previewBlob = blob || null;
      previewObjectURL = blob ? url : null;

      let revealed = false;
      const reveal = () => {
        if (revealed) return;
        revealed = true;
        savePreview.onload = null;
        savePreview.onerror = null;
        saveModal.classList.add('active');
      };

      savePreview.onload = reveal;
      savePreview.onerror = reveal;
      savePreview.src = url;

      setTimeout(reveal, 1200);
    }

    function buildExportCanvas() {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = state.imgWidth;
      exportCanvas.height = state.imgHeight;
      const exportCtx = exportCanvas.getContext('2d');

      exportCtx.drawImage(state.image, 0, 0);

      state.annotations.forEach(a => {
        if (a.type === 'rect') {
          exportCtx.save();
          applyShadow(exportCtx, a);
          drawRoundedRect(exportCtx, a);
          exportCtx.restore();
        } else if (a.type === 'hide') {
          drawHide(exportCtx, a);
        } else if (a.type === 'arrow') {
          exportCtx.save();
          applyShadow(exportCtx, a);
          drawArrow(exportCtx, a);
          exportCtx.restore();
        } else if (a.type === 'text') {
          drawText(exportCtx, a);
        } else if (a.type === 'image') {
          exportCtx.save();
          applyShadow(exportCtx, a);
          drawImageAnno(exportCtx, a);
          exportCtx.restore();
        }
      });

      return exportCanvas;
    }

    // Canvas → Blob のユーティリティ
    function canvasToBlob(canvas) {
      return new Promise((resolve) => {
        if (typeof canvas.toBlob === 'function') {
          canvas.toBlob((b) => resolve(b), 'image/png');
        } else {
          try {
            const dataURL = canvas.toDataURL('image/png');
            const bin = atob(dataURL.split(',')[1]);
            const len = bin.length;
            const buf = new Uint8Array(len);
            for (let i = 0; i < len; i++) buf[i] = bin.charCodeAt(i);
            resolve(new Blob([buf], { type: 'image/png' }));
          } catch (e) {
            resolve(null);
          }
        }
      });
    }

    btnExport.addEventListener('click', () => {
      if (!state.image) return;

      const exportCanvas = buildExportCanvas();

      releasePreviewObjectURL();

      canvasToBlob(exportCanvas).then((blob) => {
        if (blob) {
          showSavePreview(URL.createObjectURL(blob), blob);
        } else {
          showSavePreview(exportCanvas.toDataURL('image/png'), null);
        }
      });
    });

    // -------------------------------------------------------------
    // Web Share API で PNG ファイルを共有
    // -------------------------------------------------------------
    async function shareExportImage() {
      if (!state.image) return;

      const exportCanvas = buildExportCanvas();
      const blob = await canvasToBlob(exportCanvas);

      if (!blob) {
        alert('画像の生成に失敗しました。');
        return;
      }

      const fileName = 'cocomark_' + Date.now() + '.png';
      let file;
      try {
        file = new File([blob], fileName, { type: 'image/png' });
      } catch (e) {
        file = blob;
        file.name = fileName;
      }

      if (navigator.canShare && navigator.share) {
        try {
          if (navigator.canShare({ files: [file] })) {
            btnShareImage.disabled = true;
            await navigator.share({
              files: [file],
              title: 'ココマーク',
              text: 'ココマークで作成した画像'
            });
            return;
          }
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        } finally {
          btnShareImage.disabled = false;
        }
      }

      // フォールバック：ダウンロード
      try {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 1000);
      } catch (e) {
        alert('この端末では共有機能が利用できません。画像を長押しして保存してください。');
      }
    }

    btnShareImage.addEventListener('click', shareExportImage);

    // -------------------------------------------------------------
    // クリップボードへコピー
    // -------------------------------------------------------------
    async function copyExportImage() {
      if (!state.image) return;

      // プレビュー時に生成した Blob を優先的に使う
      let blob = previewBlob;
      if (!blob) {
        const exportCanvas = buildExportCanvas();
        blob = await canvasToBlob(exportCanvas);
      }

      if (!blob) {
        alert('画像の生成に失敗しました。');
        return;
      }

      if (!navigator.clipboard || !window.ClipboardItem) {
        alert('この端末ではコピーが利用できません。');
        return;
      }

      try {
        btnCopyImage.disabled = true;
        await navigator.clipboard.write([
          new ClipboardItem({ 'image/png': blob })
        ]);
        const orig = btnCopyImage.textContent;
        btnCopyImage.textContent = 'コピー完了';
        setTimeout(() => { btnCopyImage.textContent = orig; }, 1500);
      } catch (err) {
        alert('コピーに失敗しました。画像を長押しして保存してください。');
      } finally {
        btnCopyImage.disabled = false;
      }
    }

    btnCopyImage.addEventListener('click', copyExportImage);

    // -------------------------------------------------------------
    // モーダルの外側タップで閉じる（「閉じる」ボタン廃止）
    // -------------------------------------------------------------
    saveModal.addEventListener('click', (e) => {
      if (e.target === saveModal) {
        saveModal.classList.remove('active');
      }
    });

    // ページ離脱時に Object URL を解放
    window.addEventListener('pagehide', () => {
      releasePreviewObjectURL();
    });

    init();
  </script>
</body>
</html>
